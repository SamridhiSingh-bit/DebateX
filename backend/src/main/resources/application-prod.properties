# Production Profile for DebateX Backend
spring.application.name=debatex-backend
server.port=${PORT:8080}

# Managed PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/debatex}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Provider Configuration
app.ai.api-key=${OPENAI_API_KEY:${AI_API_KEY:}}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# CORS Configuration - comma separated production origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://debatex.vercel.app,https://debatex.onrender.com}
